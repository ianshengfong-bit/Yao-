<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta name="theme-color" content="#2563eb">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <title>YAO 消防工程管理系統</title>

    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- 手機頂部 -->
    <header class="mobile-header">
        <button id="menuBtn" class="menu-btn">☰</button>

        <div class="mobile-title">
            YAO 消防管理
        </div>

        <button id="addMobileBtn" class="mobile-add-btn">＋</button>
    </header>


    <!-- 左側選單 -->
    <aside id="sidebar" class="sidebar">

        <div class="logo-area">
            <div class="logo-icon">Y</div>

            <div>
                <div class="logo-title">YAO</div>
                <div class="logo-subtitle">消防工程管理</div>
            </div>
        </div>

        <nav class="nav">

            <button class="nav-item active" data-page="dashboard">
                <span>📊</span>
                <span>儀表板</span>
            </button>

            <button class="nav-item" data-page="projects">
                <span>🏗️</span>
                <span>工程案件</span>
            </button>

            <button class="nav-item" data-page="tasks">
                <span>📋</span>
                <span>工作事項</span>
            </button>

            <button class="nav-item" data-page="reminders">
                <span>🔔</span>
                <span>提醒事項</span>
            </button>

            <button class="nav-item" data-page="notes">
                <span>📝</span>
                <span>備忘錄</span>
            </button>

        </nav>

    </aside>


    <!-- 遮罩 -->
    <div id="overlay" class="overlay"></div>


    <!-- 主內容 -->
    <main class="main">

        <div class="topbar">

            <div>
                <h1 id="pageTitle">儀表板</h1>
                <p id="pageSubtitle">消防工程管理總覽</p>
            </div>

            <button id="addBtn" class="primary-btn">
                ＋ 新增
            </button>

        </div>


        <!-- 儀表板 -->
        <section id="dashboard" class="page active">

            <div class="stats">

                <div class="stat-card">
                    <div class="stat-icon blue">🏗️</div>
                    <div>
                        <div class="stat-label">工程案件</div>
                        <div id="projectCount" class="stat-number">0</div>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-icon orange">📋</div>
                    <div>
                        <div class="stat-label">待辦事項</div>
                        <div id="taskCount" class="stat-number">0</div>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-icon red">🔔</div>
                    <div>
                        <div class="stat-label">提醒</div>
                        <div id="reminderCount" class="stat-number">0</div>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-icon green">📝</div>
                    <div>
                        <div class="stat-label">備忘錄</div>
                        <div id="noteCount" class="stat-number">0</div>
                    </div>
                </div>

            </div>


            <div class="content-card">

                <div class="card-header">
                    <h2>最近工程</h2>

                    <button class="text-btn" data-page-target="projects">
                        查看全部
                    </button>
                </div>

                <div id="recentProjects" class="empty-state">
                    <div class="empty-icon">🏗️</div>
                    <h3>目前還沒有工程</h3>
                    <p>按右上角「新增」建立第一個工程案件</p>
                </div>

            </div>

        </section>


        <!-- 工程案件 -->
        <section id="projects" class="page">

            <div class="section-header">
                <div>
                    <h2>工程案件</h2>
                    <p>管理消防工程案件</p>
                </div>

                <button class="primary-btn" id="addProjectBtn">
                    ＋ 新增工程
                </button>
            </div>

            <div id="projectList" class="card-grid"></div>

        </section>


        <!-- 工作事項 -->
        <section id="tasks" class="page">

            <div class="section-header">
                <div>
                    <h2>工作事項</h2>
                    <p>記錄每天需要處理的工作</p>
                </div>

                <button class="primary-btn" id="addTaskBtn">
                    ＋ 新增事項
                </button>
            </div>

            <div id="taskList" class="list-card"></div>

        </section>


        <!-- 提醒 -->
        <section id="reminders" class="page">

            <div class="section-header">
                <div>
                    <h2>提醒事項</h2>
                    <p>重要工作與時間提醒</p>
                </div>

                <button class="primary-btn" id="addReminderBtn">
                    ＋ 新增提醒
                </button>
            </div>

            <div id="reminderList" class="list-card"></div>

        </section>


        <!-- 備忘錄 -->
        <section id="notes" class="page">

            <div class="section-header">
                <div>
                    <h2>備忘錄</h2>
                    <p>快速記錄現場資訊</p>
                </div>

                <button class="primary-btn" id="addNoteBtn">
                    ＋ 新增備忘
                </button>
            </div>

            <div id="noteList" class="card-grid"></div>

        </section>

    </main>


    <!-- 新增視窗 -->
    <div id="modal" class="modal">

        <div class="modal-box">

            <div class="modal-header">

                <h2 id="modalTitle">新增資料</h2>

                <button id="closeModal" class="close-btn">
                    ×
                </button>

            </div>

            <div id="modalBody"></div>

        </div>

    </div>


    <script src="app.js"></script>

</body>
</html>
